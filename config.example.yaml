# Dakosys starter configuration
# Copy this file to: config/config.yaml
#
# IMPORTANT:
# - Replace all example values before use.
# - Do not commit real Plex, Sonarr, TMDB, MediUX, Trakt, or Discord credentials.
# - Automatic anime scheduling generates config/scheduled-anime.yaml.
#   A manually maintained anime schedule list is not used when
#   scheduler.auto_schedule.enabled is true.

plex:
  url: http://192.168.1.100:32400
  token: REPLACE_WITH_PLEX_TOKEN
  libraries:
    anime:
      - Anime
    movie:
      - Movies
    tv:
      - TV

# TMDB v3 API key.
# Used by TV Status metadata, Artwork Manager identity enrichment and
# artwork fallback for supported shows/movies, and by the web UI.
# TMDB_TOKEN may be supplied as an advanced environment-variable
# bearer-token override.
tmdb_api_key: REPLACE_WITH_TMDB_API_KEY

trakt:
  # Trakt is NOT required for services.anime_episode_type.
  #
  # It IS required when using:
  # - scheduler.auto_schedule
  # - optional legacy episode-list publishing
  username: REPLACE_WITH_TRAKT_USERNAME
  client_id: REPLACE_WITH_TRAKT_CLIENT_ID
  client_secret: REPLACE_WITH_TRAKT_CLIENT_SECRET
  redirect_uri: urn:ietf:wg:oauth:2.0:oob

  # Legacy compatibility only.
  # Local Anime Episode Type generation does not use these lists.
  episode_list_publishing:
    enabled: false

lists:
  default_privacy: public

kometa_config:
  asset_directory: /kometa/assets
  collections_dir: /kometa/collections
  yaml_output_dir: /kometa/overlays

services:
  # Discovers supported Plex libraries automatically and creates one
  # independent Kometa artwork item-store directory per Plex library.
  #
  # Plex library names are not predefined by Dakosys. A library named
  # "Series", "Films", "Kids & Family", or anything else works the same.
  #
  # Artwork Manager writes Kometa metadata, not overlays, so its
  # output directory is configured independently from yaml_output_dir.
  #
  # Default library stores are created as:
  #
  #   <output_dir>/artwork-<plex-library>/
  #
  # Each managed show or movie is rendered to its own YAML file.
  # Dakosys also maintains ownership-manifest and durable-state
  # information used to preserve safe selections between runs.
  artwork_manager:
    enabled: false

    # Safe changes are applied automatically by default.
    # Safety is independent from apply mode: unsafe plans remain BLOCKED.
    #
    # Set this to "manual" to retain safe changes for review instead
    # of writing them automatically.
    apply_mode: auto

    output_dir: /kometa/metadata

    providers:
      mediux:
        # MediUX is the required primary Artwork Manager provider.
        # MEDIUX_API_TOKEN may be supplied through the container
        # environment and takes precedence over this value.
        api_token: REPLACE_WITH_MEDIUX_API_TOKEN

    #
    # Optional library filtering and directory overrides:
    #
    # libraries:
    #   include:
    #     - Series
    #
    #   exclude:
    #     - Home Videos
    #
    #   overrides:
    #     Kids & Family:
    #       output: /kometa/metadata/kids-artwork

  # Plex + AnimeFillerList -> local episode mapper -> Kometa.
  # No Trakt account or Trakt personal lists are required.
  anime_episode_type:
    enabled: true

  # Resolves TV lifecycle and upcoming episodes locally.
  #
  # Lifecycle precedence:
  #   TMDB -> Sonarr -> TVmaze
  #
  # Next episode precedence:
  #   Sonarr -> TMDB -> TVmaze
  #
  # Trakt is not required for TV Status or Next Airing.
  tv_status_tracker:
    enabled: true
    collections_dir: /kometa/collections

    metadata:
      sonarr:
        enabled: true
        url: http://192.168.1.100:8989
        api_key: REPLACE_WITH_SONARR_API_KEY

      # Uses the top-level tmdb_api_key.
      tmdb:
        enabled: true

      # Public credential-free fallback.
      tvmaze:
        enabled: true

  size_overlay:
    enabled: false

scheduler:
  artwork_manager:
    times:
      - "04:00"
    type: daily

  anime_episode_type:
    times:
      - "03:00"
    type: daily

  # Uses Trakt show metadata only; does not publish episode-type lists.
  auto_schedule:
    enabled: true
    file: config/scheduled-anime.yaml
    refresh_hours: 24
    notify_on_change: true
    always_include: []
    always_exclude: []

    # Optional tuning:
    # trakt_request_delay_seconds: 0.5
    # trakt_max_retries: 5

  tv_status_tracker:
    times:
      - "02:00"
    type: daily

notifications:
  enabled: true

  # Recommended: provide the Discord webhook through the container environment:
  #
  #   DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/...
  #
  # The automatic scheduler sends a notification only when membership changes.
